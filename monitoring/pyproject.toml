[project]
name = "loopwatch-monitor"
version = "0.1.0"
description = "LoopWatch 4.2 baseline: fixed, passive LLM monitor and offline scorer"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
data = ["datasets>=2.18", "huggingface_hub>=0.22", "pandas>=2", "pyarrow>=14"]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loopwatch_monitor*"]

[tool.setuptools.package-data]
loopwatch_monitor = ["monitor/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
